<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>test</title>
    <style>
        body {
            background-color: #2b2b2b; /* Тёмно-серый фон */
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }
        .image-container {
            background-color: #1e1e1e; /* Чуть более тёмный фон для «окна» */
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5); /* Тень для эффекта объёма */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .image-container img {
            max-width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="image-container">
        <img src="https://static.wikia.nocookie.net/murder-mystery-2/images/9/9e/Traveler%27s_Gun_2023.png/revision/latest/thumbnail/width/360/height/360?cb=20231018105154" alt="Traveler's Gun 2023">
    </div>

</body>
</html>
